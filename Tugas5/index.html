
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>GitHub Profile Finder</h1>
        <p>Cari profil pengguna GitHub</p>

        <form id="searchForm">
            <input
                type="text"
                id="username"
                placeholder="Masukkan username GitHub..."
                required
            >
            <button type="submit">Cari Profil</button>
        </form>

        <div id="message"></div>

        <div id="profile" class="profile hidden">
            <img id="avatar" src="" alt="Avatar">

            <h2 id="name"></h2>
            <p id="login"></p>
            <p id="bio"></p>

            <div class="stats">
                <div>
                    <h3 id="repos">0</h3>
                    <span>Repository</span>
                </div>

                <div>
                    <h3 id="followers">0</h3>
                    <span>Followers</span>
                </div>

                <div>
                    <h3 id="following">0</h3>
                    <span>Following</span>
                </div>
            </div>

            <p id="location"></p>

            <a id="profileLink" href="#" target="_blank">
                Kunjungi Profil GitHub
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
